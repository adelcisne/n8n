<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiBot</title>
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat@1.40.4/dist/style.css" rel="stylesheet" />
  <style>
    :root {
     /* Colors */
	--chat--color--primary: #721c24;
	--chat--color--primary-shade-50: #5d161d;
	--chat--color--primary--shade-100: #481016;
	--chat--color--secondary: #9b2c3b;
	--chat--color-secondary-shade-50: #7f222f;
	--chat--color-white: #fff;
	--chat--color-light: #faf4f5;
	--chat--color-light-shade-50: #f1e4e6;
	--chat--color-light-shade-100: #dfc6ca;
	--chat--color-medium: #c8a4aa;
	--chat--color-dark: #2a1014;
	--chat--color-disabled: #d8c2c6;
	--chat--color-typing: #5a2b32;

      /* Dimensiones del widget */
      --chat--window--width: 400px;        /* Ancho del widget flotante */
      --chat--window--height: 600px;       /* Alto del widget flotante */
      --chat--toggle--size: 64px;          /* Tamaño del botón flotante */
    }
  </style>
</head>
<body>
  <div id="n8n-chat"></div>

  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat@1.40.4/dist/chat.bundle.es.js';

    createChat({
      webhookUrl: 'https://adecisne.app.n8n.cloud/webhook/b571c000-45ea-49f8-a096-0084852adffd/chat',
      mode: 'window',
      showWelcomeScreen: false,
      loadPreviousSession: true,
      initialMessages: ['Hola! 👋', 'Me llamo Ana, soy un asistente de Wikipedia'],
      i18n: {
        en: {
          title: 'WikiBot',
          subtitle: 'Empieza una conversación...',
          footer: '',
          getStarted: 'Nueva conversación',
          inputPlaceholder: 'Escribe tu pregunta..'
        }
      }
    });
  </script>
</body>
</html>
